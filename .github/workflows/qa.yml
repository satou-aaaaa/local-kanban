# カンバンの PWA の自動検査（Claude を使わない）。本物の GitHub や鍵は使わず、見本のデータ（qa/cards.sample.json）で
# 表示・保存・service worker・オフライン・スマホ幅を確かめ、結果を「まとめ」（Actions の Summary）に出す。
# プルリクエストで ✅ になれば automerge.yml が自動でマージし、公開まで進める。
name: QA

on:
  pull_request:
    # 下書きを外したときも回す（回らないと自動マージが起きない）
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: PWA の検査
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 点検の記録の検査（check-review）が PR の元と比べるので、履歴ごと取る
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Playwright を入れる
        run: |
          cd qa
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 点検の記録（画面を変えた PR に reviews/v<版>.md と2役の点検があるか。手順は reviews/README.md）
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node qa/check-review.mjs "$BASE"
      - name: 点検の記録の検査そのものを試す（同じ版を2つの PR が取ったら落ちるか。Issue #87）
        run: node --test qa/check-review.test.mjs
      - name: 検査
        run: node qa/run.mjs --out qa-report
      - name: 使いやすさの数字（名前・押す所・はみ出し・字の大きさ・明るさの差・文字の量。基準は qa/uiux-baseline.json）
        run: node qa/check-uiux.mjs
      - name: 結果をまとめに出す
        if: always()
        run: test -f qa-report/report.md && cat qa-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qa-report
          path: qa-report
          retention-days: 30

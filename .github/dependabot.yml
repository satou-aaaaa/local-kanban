version: 2
updates:
  # 検査（qa/）の Playwright。qa/ だけを変える PR なので、QA が ✅ なら自動マージされる
  - package-ecosystem: "npm"
    directory: "/qa"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
  # ワークフローの Actions。.github/ を変える PR は自動マージされないので、まとめて月1回にして手間を減らす
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

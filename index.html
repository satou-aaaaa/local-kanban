<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 外に出さない保証：通信できる先は自分のサイトと GitHub の API（カードの保存）と、モデルの置き場（「AI の部品を入れる」を押したときだけ）。声・会話・AI は端末の中で動く -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' file:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'">
<title>カンバン</title>
<!--
  Claude が使えないときに使うカンバン（PWA）。画面は claude.ai のボードそのもの。
  ボードの HTML はこのリポジトリ（公開）には置かず、データのリポジトリ（非公開）の board/index.html（毎日の写し）を
  つないだあとに読んで、この端末に取っておく（boot.js）。データの読み書きは shim.js、アプリだけの機能は app.js。
  データの置き場所は3通り（どれもこのページには載せない）:
    GitHub   … 非公開リポジトリの local-board/cards.json を、端末に貼った鍵（fine-grained トークン）で読み書きする。PC・スマホ両方
    フォルダ … PC のフォルダ（データのリポジトリを取ってきたもの）を File System Access API で読み書きする。Chrome・Edge の PC だけ
    ファイル … cards.json を選んで読み、ダウンロードで保存する（どのブラウザでも）
-->
<script src="boot.js"></script>
</head>
<body></body>
</html>
